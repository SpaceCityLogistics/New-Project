<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>AstroTech Defender</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <header class="topbar">
        <div class="score">Score: <span id="score">0</span></div>
        <div class="lives">Lives: <span id="lives">3</span></div>
        <div class="best">Best: <span id="best">0</span></div>
      </header>

      <div class="board-wrap">
        <canvas id="board" width="300" height="450"></canvas>

        <div id="startOverlay" class="overlay">
          <img class="logo" src="assets/astrotech-logo.png" alt="AstroTech Solutions" />
          <h1>AstroTech Defender</h1>
          <p>Drag or use arrows to move &middot; tap FIRE to shoot</p>
          <p class="sub">Purge the viruses. Grab power-ups. Protect the network.</p>
          <button id="startBtn">Play</button>
        </div>

        <div id="gameOverOverlay" class="overlay hidden">
          <h1>Signal Lost</h1>
          <p id="finalScore">Score: 0</p>
          <button id="restartBtn">Play Again</button>
        </div>
      </div>

      <div class="dpad">
        <button class="dbtn left" data-dir="left">&#9664;</button>
        <button class="dbtn fire" id="fireBtn">FIRE</button>
        <button class="dbtn right" data-dir="right">&#9654;</button>
      </div>

      <div class="brandFooter">AstroTech Solutions &middot; Repairs, Setup &amp; Support</div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
